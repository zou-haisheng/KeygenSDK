name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.triplet }} / ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { configuration: Debug,   arch: x64,   triplet: x64-windows }
          - { configuration: Release, arch: x64,   triplet: x64-windows }
          - { configuration: Debug,   arch: Win32, triplet: x86-windows }
          - { configuration: Release, arch: Win32, triplet: x86-windows }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Visual Studio 18 2026" -A ${{ matrix.arch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

      - name: Install
        run: cmake --install build --config ${{ matrix.configuration }}

      - name: Package
        run: |
          Compress-Archive -Path install\* -DestinationPath KeygenSDK-${{ matrix.triplet }}-${{ matrix.configuration }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeygenSDK-${{ matrix.triplet }}-${{ matrix.configuration }}
          path: KeygenSDK-${{ matrix.triplet }}-${{ matrix.configuration }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
